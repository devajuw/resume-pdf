name: Update Resume PDF from Overleaf

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 6 AM UTC (change if you want)
  workflow_dispatch:       # you can also trigger it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          OVERLEAF_URL: ${{ secrets.OVERLEAF_URL }}
        run: node scraper.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update resume PDF $(date -u +%Y-%m-%d)"
            git push
          fi
